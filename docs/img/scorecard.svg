t-weight="800" text-anchor="middle" fill="#e6edf7">70.1%</text><text x="600" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#e6edf7">step F1</text><text x="600" y="276" font-size="11.5" text-anchor="middle" fill="#93a1bd">precision 74.4% · recall 66.3%</text><circle cx="840" cy="170" r="52" fill="none" stroke="#1c2548" stroke-width="12"/><circle class="ring" style="--to:214.41;--d:0.75s" cx="840" cy="170" r="52" fill="none" stroke="#fb923c" stroke-width="12" stroke-linecap="round" transform="rotate(-90 840 170)"/><text class="lbl" style="--d:0.75s" x="840" y="178" font-size="24" font-weight="800" text-anchor="middle" fill="#e6edf7">34.4%</text><text x="840" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#e6edf7">exact case match</text><text x="840" y="276" font-size="11.5" text-anchor="middle" fill="#93a1bd">whole row identical</text><g transform="translate(1080 170)"><path class="shield" d="M0 -54L46 -34V6C46 34 23 50 0 60C-23 50 -46 34 -46 6V-34Z" fill="#4ade80" fill-opacity=".14" stroke="#4ade80" stroke-width="4"/><text y="12" font-size="40" font-weight="800" text-anchor="middle" fill="#e6edf7">0</text></g><text x="1080" y="256" font-size="14" font-weight="700" text-anchor="middle" fill="#e6edf7">false COMPLETE</text><text x="1080" y="276" font-size="11.5" text-anchor="middle" fill="#93a1bd">the worst error: “done” when it is not</text>
