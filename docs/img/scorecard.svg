<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.seg{transform-box:fill-box;transform-origin:left center;animation:grow 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes grow{0%{transform:scaleX(0);opacity:1}22%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.lbl{animation:lbl 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes lbl{0%,16%{opacity:0}30%{opacity:1}88%{opacity:1}100%{opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.95}}.ring{stroke-dasharray:326.73;animation:fill 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes fill{0%{stroke-dashoffset:326.73;opacity:1}24%{stroke-dashoffset:var(--to)}88%{stroke-dashoffset:var(--to);opacity:1}100%{stroke-dashoffset:var(--to);opacity:0}}.shield{transform-box:fill-box;transform-origin:center;animation:beat 2.6s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.07)}}</style>
