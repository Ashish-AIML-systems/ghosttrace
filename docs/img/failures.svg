<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" width="1200" height="372" role="img" aria-labelledby="t d">
<title id="t">Findings left behind by incomplete deletions</title><desc id="d">Bar chart of finding types across all incomplete deletions.</desc>
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.seg{transform-box:fill-box;transform-origin:left center;animation:grow 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes grow{0%{transform:scaleX(0);opacity:1}22%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.lbl{animation:lbl 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes lbl{0%,16%{opacity:0}30%{opacity:1}88%{opacity:1}100%{opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.95}}</style>
<rect width="1200" height="372" rx="22" fill="url(#bgg)"/><rect x=".75" y=".75" width="1198.5" height="370.5" rx="21.5" fill="none" stroke="#2a3558" stroke-width="1.5"/><text x="40" y="46" font-size="22" font-weight="800" fill="#e6edf7">What the 355 incomplete deletions left behind</text><text x="40" y="72" font-size="13" fill="#93a1bd">One case can leave several kinds of finding, so the bars add up to more than 355.</text><text class="m" x="40" y="119" font-size="14" font-weight="700" fill="#fb7185">REMAINING_RECORD</text><text x="40" y="138" font-size="12" fill="#93a1bd">a record that should be gone still exists</text><rect class="seg" style="--d:0.00s" x="360" y="106" width="640.0" height="32" rx="6" fill="#fb7185" fill-opacity=".9"/><text class="lbl" style="--d:0.00s" x="1012.0" y="129" font-size="17" font-weight="800" fill="#e6edf7">291</text><text class="m" x="40" y="177" font-size="14" font-weight="700" fill="#fbbf24">EXPOSED_PII</text><text x="40" y="196" font-size="12" fill="#93a1bd">kept on purpose, but identifiers are still readable</text><rect class="seg" style="--d:0.20s" x="360" y="164" width="362.9" height="32" rx="6" fill="#fbbf24" fill-opacity=".9"/><text class="lbl" style="--d:0.20s" x="734.9" y="187" font-size="17" font-weight="800" fill="#e6edf7">165</text><text class="m" x="40" y="235" font-size="14" font-weight="700" fill="#a78bfa">ACTIVE_DATA_FLOW</text><text x="40" y="254" font-size="12" fill="#93a1bd">a sync or import job can copy the data back</text><rect class="seg" style="--d:0.40s" x="360" y="222" width="248.5" height="32" rx="6" fill="#a78bfa" fill-opacity=".9"/><text class="lbl" style="--d:0.40s" x="620.5" y="245" font-size="17" font-weight="800" fill="#e6edf7">113</text><text class="m" x="40" y="293" font-size="14" font-weight="700" fill="#2dd4bf">RESTORE_RISK</text><text x="40" y="312" font-size="12" fill="#93a1bd">a backup can restore what was deleted</text><rect class="seg" style="--d:0.60s" x="360" y="280" width="57.2" height="32" rx="6" fill="#2dd4bf" fill-opacity=".9"/><text class="lbl" style="--d:0.60s" x="429.2" y="303" font-size="17" font-weight="800" fill="#e6edf7">26</text><text x="40" y="356" font-size="11.5" fill="#93a1bd">source: results/insight_summary.json · findings are the four allowed REPORT_* operations</text>
</svg>
