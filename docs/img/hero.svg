<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="t d">
<title id="t">GhostTrace</title><desc id="d">An animated ghost with a magnifying glass above the project name and live audit figures.</desc>
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient><linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0"/><stop offset="1" stop-color="#2dd4bf" stop-opacity=".10"/></linearGradient></defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.bob{animation:bob 4.2s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}.tok{font-size:14px;font-weight:700;fill:#fb7185;opacity:0;animation:rise 7s linear infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}80%{opacity:.45}100%{transform:translateY(-250px);opacity:0}}.caret{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}</style>
<rect width="1200" height="440" rx="22" fill="url(#bgg)"/><rect x=".75" y=".75" width="1198.5" height="438.5" rx="21.5" fill="none" stroke="#2a3558" stroke-width="1.5"/><rect x="0" y="-90" width="1200" height="90" fill="url(#beam)" opacity=".55"><animate attributeName="y" values="-90;440;-90" dur="9s" repeatCount="indefinite"/></rect><text class="m" x="64" y="84" font-size="13" letter-spacing="3" fill="#2dd4bf">HACKERRANK ORCHESTRATE · OCTOBER 2026</text><text x="62" y="170" font-size="88" font-weight="800" fill="url(#tg)">GhostTrace</text><text x="64" y="212" font-size="26" font-weight="600" fill="#e6edf7">Deletion said Complete. Did the data actually leave?</text><text x="64" y="244" font-size="16" fill="#93a1bd">A deterministic deletion-audit agent for “Ghost Data Still Exists”.</text><rect x="64" y="266" width="660" height="50" rx="12" fill="#0a0f1f" stroke="#2a3558"/><clipPath id="ty0"><rect x="84" y="276" height="30" width="0"><animate attributeName="width" dur="15.0s" repeatCount="indefinite" values="0;0;510.0;510.0;0;0" keyTimes="0.0000;0.0000;0.1267;0.2867;0.3067;1.0000"/></rect></clipPath><text class="m" x="84" y="298" font-size="17" fill="#2dd4bf" textLength="510.0" lengthAdjust="spacing" clip-path="url(#ty0)">&gt; workflow says COMPLETE ... checking the evidence</text><rect x="84" y="281" width="9" height="20" fill="#2dd4bf" class="caret"><animate attributeName="x" dur="15.0s" repeatCount="indefinite" values="84;84;594.0;594.0;84;84" keyTimes="0.0000;0.0000;0.1267;0.2867;0.3067;1.0000"/></rect><clipPath id="ty1"><rect x="84" y="276" height="30" width="0"><animate attributeName="width" dur="15.0s" repeatCount="indefinite" values="0;0;561.0;561.0;0;0" keyTimes="0.0000;0.3333;0.4600;0.6200;0.6400;1.0000"/></rect></clipPath><text class="m" x="84" y="298" font-size="17" fill="#2dd4bf" textLength="561.0" lengthAdjust="spacing" clip-path="url(#ty1)">&gt; 163 of 254 &#x27;Complete&#x27; deletions still held data (64%)</text><rect x="84" y="281" width="9" height="20" fill="#2dd4bf" class="caret"><animate attributeName="x" dur="15.0s" repeatCount="indefinite" values="84;84;645.0;645.0;84;84" keyTimes="0.0000;0.3333;0.4600;0.6200;0.6400;1.0000"/></rect><clipPath id="ty2"><rect x="84" y="276" height="30" width="0"><animate attributeName="width" dur="15.0s" repeatCount="indefinite" values="0;0;561.0;561.0;0;0" keyTimes="0.0000;0.6667;0.7933;0.9533;0.9733;1.0000"/></rect></clipPath><text class="m" x="84" y="298" font-size="17" fill="#2dd4bf" textLength="561.0" lengthAdjust="spacing" clip-path="url(#ty2)">&gt; evidence in, verdict out. deterministic. no guessing.</text><rect x="84" y="281" width="9" height="20" fill="#2dd4bf" class="caret"><animate attributeName="x" dur="15.0s" repeatCount="indefinite" values="84;84;645.0;645.0;84;84" keyTimes="0.0000;0.6667;0.7933;0.9533;0.9733;1.0000"/></rect><text class="tok m" x="770" y="340" style="animation-delay:0.0s">@mail</text><text class="tok m" x="860" y="340" style="animation-delay:1.4s">+91 98</text><text class="tok m" x="960" y="340" style="animation-delay:2.6s">#a9f3c</text><text class="tok m" x="1050" y="340" style="animation-delay:0.8s">name</text><text class="tok m" x="800" y="340" style="animation-delay:3.6s">addr</text><text class="tok m" x="1000" y="340" style="animation-delay:4.6s">sha256</text><text class="tok m" x="920" y="340" style="animation-delay:5.4s">dob</text><g transform="translate(900 92) scale(1.75)"><g class="bob"><ellipse cx="50" cy="134" rx="36" ry="5" fill="#000" opacity=".3"/><path d="M0 50C0 22 22 0 50 0s50 22 50 50v70l-17-15-16 15-17-15-17 15-16-15-17 15z" fill="url(#gg)" filter="url(#glow)"/><ellipse cx="34" cy="50" rx="7" ry="9" fill="#0b1020"><animate attributeName="ry" dur="4s" repeatCount="indefinite" values="9;9;1;9" keyTimes="0;0.92;0.96;1"/></ellipse><ellipse cx="66" cy="50" rx="7" ry="9" fill="#0b1020"><animate attributeName="ry" dur="4s" repeatCount="indefinite" values="9;9;1;9" keyTimes="0;0.92;0.96;1"/></ellipse><ellipse cx="50" cy="76" rx="6"