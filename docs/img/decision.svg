<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="t d">
<title id="t">How a verdict is decided</title><desc id="d">Flow from a deletion request through identity, time cut-off, state and recreation checks to COMPLETE, INCOMPLETE or NOT_APPLICABLE.</desc>
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ah-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7083b8"/></marker><marker id="ah-g" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4ade80"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb7185"/></marker><marker id="ah-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker></defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.wire{stroke-dasharray:7 6;animation:march 1.1s linear infinite}@keyframes march{to{stroke-dashoffset:-13}}.dia{animation:dia 3.2s ease-in-out infinite}@keyframes dia{50%{stroke-opacity:.35}}.node{animation:node 3.2s ease-in-out infinite}@keyframes node{50%{stroke-opacity:1}}</style>
<rect width="1200" height="690" rx="22" fill="url(#bgg)"/><rect x=".75" y=".75" width="1198.5" height="688.5" rx="21.5" fill="none" stroke="#2a3558" stroke-width="1.5"/><text class="m" x="40" y="44" font-size="14" letter-spacing="2" fill="#2dd4bf">HOW A VERDICT IS DECIDED</text><text x="40" y="68" font-size="13" fill="#93a1bd">Every request takes the same path. The answer comes from the evidence at audit_at, never from the workflow&#8217;s own claim.</text><g transform="translate(0 14)"><circle r="5.5" fill="#94a3b8" filter="url(#glow)"><animateMotion dur="8.0s" begin="0.0s" repeatCount="indefinite" path="M30 150H320V300"/></circle><circle r="5.5" fill="#4ade80" filter="url(#glow)"><animateMotion dur="13.0s" begin="-3.0s" repeatCount="indefinite" path="M30 150H1093V262H700V385H250"/></circle><circle r="5.5" fill="#fb7185" filter="url(#glow)"><animateMotion dur="17.0s" begin="0.0s" repeatCount="indefinite" path="M30 150H1093V262H700V385H1035V470H677V546H1165"/></circle><circle r="5.5" fill="#fb7185" filter="url(#glow)"><animateMotion dur="17.0s" begin="-8.5s" repeatCount="indefinite" path="M30 150H1093V262H700V385H1035V470H677V546H1165"/></circle><path class="wire" d="M190 150H223" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M415 150H448" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M603 150H637" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M792 150H826" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M981 150H1015" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M320 212V268" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah-n)"/><path class="wire" d="M1093 210V262H700V308" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M560 385H502" fill="none" stroke="#4ade80" stroke-width="2" marker-end="url(#ah-g)"/><path class="wire" d="M840 385H898" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#ah-r)"/><path class="wire" d="M1035 425V470H677V498" fill="none" stroke="#fb7185" stroke-width="2" marker-end="url(#ah-r)"/><path class="wire" d="M765 546H788" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><path class="wire" d="M965 546H988" fill="none" stroke="#7083b8" stroke-width="2" marker-end="url(#ah-b)"/><rect x="30" y="115" width="160" height="70" rx="35" fill="#0f1630" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.5"/><text x="110" y="145" font-size="14" font-weight="800" text-anchor="middle" fill="#e6edf7">Deletion request</text><text x="110" y="164" font-size="11" text-anchor="middle" fill="#93a1bd">email · audit_at · text</text><polygon class="dia" points="225,150 320,88 415,150 320,212" fill="#0f1630" stroke="#2dd4bf" stroke-opacity=".9" stroke-width="1.5"/><text x="320" y="146" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf7">Does the text</text><text x="320" y="162" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf7">ask for deletion?</text><rect class="node" x="450" y="90" width="153" height="120" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="474" cy="117" r="11" fill="#a78bfa"/><text x="474" y="122" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">1</text><text x="494" y="122" font-size="15" font-weight="800" fill="#e6edf7">Resolve who</text><text x="466" y="148" font-size="12" fill="#93a1bd">current and past</text><text x="466" y="164" font-size="12" fill="#93a1bd">email, phone, hash</text><text x="466" y="180" font-size="12" fill="#93a1bd">→ one stable user</text><rect class="node" x="639" y="90" width="153" height="120" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="663" cy="117" r="11" fill="#a78bfa"/><text x="663" y="122" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">2</text><text x="683" y="122" font-size="15" font-weight="800" fill="#e6edf7">Cut off</text><text x="655" y="148" font-size="12" fill="#93a1bd">evidence after</text><text x="655" y="164" font-size="12" fill="#93a1bd">audit_at is excluded;</text><text x="655" y="180" font-size="12" fill="#93a1bd">claims are not proof</text><rect class="node" x="828" y="90" width="153" height="120" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="852" cy="117" r="11" fill="#a78bfa"/><text x="852" y="122" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">3</text><text x="872" y="122" font-size="15" font-weight="800" fill="#e6edf7">Rebuild state</text><text x="844" y="148" font-size="12" fill="#93a1bd">every system and</text><text x="844" y="164" font-size="12" fill="#93a1bd">resource; replicas and</text><text x="844" y="180" font-size="12" fill="#93a1bd">conflicts stay apart</text><rect class="node" x="1017" y="90" width="153" height="120" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="1041" cy="117" r="11" fill="#a78bfa"/><text x="1041" y="122" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">4</text><text x="1061" y="122" font-size="15" font-weight="800" fill="#e6edf7">Find flows</text><text x="1033" y="148" font-size="12" fill="#93a1bd">sync, import and</text><text x="1033" y="164" font-size="12" fill="#93a1bd">restore paths that</text><text x="1033" y="180" font-size="12" fill="#93a1bd">can bring data back</text><rect class="node" x="205" y="270" width="230" height="60" rx="14" fill="#0f1630" stroke="#94a3b8" stroke-opacity=".75" stroke-width="1.5"/><text x="221" y="302" font-size="15" font-weight="800" fill="#94a3b8">NOT_APPLICABLE</text><text x="221" y="320" font-size="12" fill="#93a1bd">steps_json = []</text><text x="419" y="302" font-size="20" font-weight="800" text-anchor="end" fill="#e6edf7">10</text><polygon class="dia" points="560,385 700,310 840,385 700,460" fill="#0f1630" stroke="#fbbf24" stroke-opacity=".9" stroke-width="1.5"/><text x="700" y="365" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf7">Every copy compliant,</text><text x="700" y="381" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf7">retained records present,</text><text x="700" y="397" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf7">no flow or restore path,</text><text x="700" y="413" font-size="12.5" font-weight="600" text-anchor="middle" fill="#e6edf7">nothing uncertain?</text><rect class="node" x="240" y="345" width="260" height="80" rx="14" fill="#0f1630" stroke="#4ade80" stroke-opacity=".75" stroke-width="1.5"/><text x="256" y="377" font-size="15" font-weight="800" fill="#4ade80">COMPLETE</text><text x="256" y="395" font-size="12" fill="#93a1bd">VERIFICATION steps only, each</text><text x="256" y="411" font-size="12" fill="#93a1bd">citing the evidence that proves it</text><text x="484" y="377" font-size="20" font-weight="800" text-anchor="end" fill="#e6edf7">153</text><rect class="node" x="900" y="345" width="270" height="80" rx="14" fill="#0f1630" stroke="#fb7185" stroke-opacity=".75" stroke-width="1.5"/><text x="916" y="377" font-size="15" font-weight="800" fill="#fb7185">INCOMPLETE</text><text x="916" y="395" font-size="12" fill="#93a1bd">any violation, active flow, restore</text><text x="916" y="411" font-size="12" fill="#93a1bd">path or uncertainty ends here</text><text x="1154" y="377" font-size="20" font-weight="800" text-anchor="end" fill="#e6edf7">355</text><rect class="node" x="590" y="500" width="175" height="92" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="614" cy="527" r="11" fill="#a78bfa"/><text x="614" y="532" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">1</text><text x="634" y="532" font-size="15" font-weight="800" fill="#e6edf7">FINDING</text><text x="606" y="558" font-size="12" fill="#93a1bd">what is still there,</text><text x="606" y="574" font-size="12" fill="#93a1bd">each with an evidence id</text><rect class="node" x="790" y="500" width="175" height="92" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="814" cy="527" r="11" fill="#a78bfa"/><text x="814" y="532" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">2</text><text x="834" y="532" font-size="15" font-weight="800" fill="#e6edf7">REMEDIATION</text><text x="806" y="558" font-size="12" fill="#93a1bd">stop flows, block</text><text x="806" y="574" font-size="12" fill="#93a1bd">restores, fix records</text><rect class="node" x="990" y="500" width="175" height="92" rx="14" fill="#0f1630" stroke="#a78bfa" stroke-opacity=".75" stroke-width="1.5"/><circle cx="1014" cy="527" r="11" fill="#a78bfa"/><text x="1014" y="532" font-size="13" font-weight="800" text-anchor="middle" fill="#0b1020">3</text><text x="1034" y="532" font-size="15" font-weight="800" fill="#e6edf7">VERIFICATION</text><text x="1006" y="558" font-size="12" fill="#93a1bd">the checks that must</text><text x="1006" y="574" font-size="12" fill="#93a1bd">pass after the fix</text><rect x="414.1" y="124" width="35.8" height="20" rx="10" fill="#0b1020" stroke="#2dd4bf" stroke-opacity=".8"/><text class="m" x="432" y="138" font-size="11" font-weight="700" text-anchor="middle" fill="#2dd4bf">yes</text><rect x="305.4" y="230" width="29.2" height="20" rx="10" fill="#0b1020" stroke="#94a3b8" stroke-opacity=".8"/><text class="m" x="320" y="244" font-size="11" font-weight="700" text-anchor="middle" fill="#94a3b8">no</text><rect x="513.1" y="358" width="35.8" height="20" rx="10" fill="#0b1020" stroke="#4ade80" stroke-opacity=".8"/><text class="m" x="531" y="372" font-size="11" font-weight="700" text-anchor="middle" fill="#4ade80">yes</text><rect x="854.4" y="358" width="29.2" height="20" rx="10" fill="#0b1020" stroke="#fb7185" stroke-opacity=".8"/><text class="m" x="869" y="372" font-size="11" font-weight="700" text-anchor="middle" fill="#fb7185">no</text><rect x="30" y="470" width="510" height="170" rx="14" fill="none" stroke="#2dd4bf" stroke-opacity=".55" stroke-width="1.5"/><text class="m" x="52" y="500" font-size="12.5" font-weight="700" letter-spacing="2" fill="#2dd4bf">RULES THAT NEVER BEND</text><circle cx="58" cy="526" r="4" fill="#2dd4bf"/><text x="74" y="530" font-size="12.5" fill="#e6edf7">A workflow status is a claim. Only evidence at audit_at counts.</text><circle cx="58" cy="554" r="4" fill="#2dd4bf"/><text x="74" y="558" font-size="12.5" fill="#e6edf7">Evidence captured after audit_at is ignored, even if it is clearer.</text><circle cx="58" cy="582" r="4" fill="#2dd4bf"/><text x="74" y="586" font-size="12.5" fill="#e6edf7">Retained records must stay; a tombstone keeps only the user id.</text><circle cx="58" cy="610" r="4" fill="#2dd4bf"/><text x="74" y="614" font-size="12.5" fill="#e6edf7">A missing result or a failed parse never proves a record is gone.</text></g>
</svg>
