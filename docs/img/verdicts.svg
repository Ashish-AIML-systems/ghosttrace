<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 318" width="1200" height="318" role="img" aria-labelledby="t d">
<title id="t">Verdicts on all requests</title><desc id="d">Cards and a proportional bar for INCOMPLETE, COMPLETE and NOT_APPLICABLE verdicts.</desc>
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.seg{transform-box:fill-box;transform-origin:left center;animation:grow 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes grow{0%{transform:scaleX(0);opacity:1}22%{transform:scaleX(1)}88%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}.lbl{animation:lbl 8s ease-out infinite backwards;animation-delay:var(--d)}@keyframes lbl{0%,16%{opacity:0}30%{opacity:1}88%{opacity:1}100%{opacity:0}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:.15}50%{opacity:.95}}</style>
<rect width="1200" height="318" rx="22" fill="url(#bgg)"/><rect x=".75" y=".75" width="1198.5" height="316.5" rx="21.5" fill="none" stroke="#2a3558" stroke-width="1.5"/><text x="40" y="46" font-size="22" font-weight="800" fill="#e6edf7">Verdicts on all 518 requests</text><text x="40" y="72" font-size="13" fill="#93a1bd">What the audit decided for every deletion request. These are the agent&#8217;s verdicts, not a measure of accuracy.</text><rect x="40" y="96" width="360" height="124" rx="16" fill="#0f1630" stroke="#fb7185" stroke-opacity=".6" stroke-width="1.5"/><rect x="56" y="96" width="328" height="4" rx="2" fill="#fb7185"/><text class="m" x="62" y="134" font-size="13" font-weight="700" letter-spacing="1" fill="#fb7185">INCOMPLETE</text><text class="lbl" style="--d:0.00s" x="62" y="190" font-size="54" font-weight="800" fill="#e6edf7">355</text><text class="lbl" style="--d:0.00s" x="378" y="190" font-size="28" font-weight="800" text-anchor="end" fill="#fb7185">68.5%</text><text x="62" y="212" font-size="12" fill="#93a1bd">findings, a fix plan and checks</text><rect class="seg" style="--d:0.00s" x="40.0" y="248" width="764.6" height="18" rx="5" fill="#fb7185" fill-opacity=".9"/><rect x="420" y="96" width="360" height="124" rx="16" fill="#0f1630" stroke="#4ade80" stroke-opacity=".6" stroke-width="1.5"/><rect x="436" y="96" width="328" height="4" rx="2" fill="#4ade80"/><text class="m" x="442" y="134" font-size="13" font-weight="700" letter-spacing="1" fill="#4ade80">COMPLETE</text><text class="lbl" style="--d:0.25s" x="442" y="190" font-size="54" font-weight="800" fill="#e6edf7">153</text><text class="lbl" style="--d:0.25s" x="758" y="190" font-size="28" font-weight="800" text-anchor="end" fill="#4ade80">29.5%</text><text x="442" y="212" font-size="12" fill="#93a1bd">every copy compliant, proof attached</text><rect class="seg" style="--d:0.25s" x="807.6" y="248" width="327.8" height="18" rx="5" fill="#4ade80" fill-opacity=".9"/><rect x="800" y="96" width="360" height="124" rx="16" fill="#0f1630" stroke="#94a3b8" stroke-opacity=".6" stroke-width="1.5"/><rect x="816" y="96" width="328" height="4" rx="2" fill="#94a3b8"/><text class="m" x="822" y="134" font-size="13" font-weight="700" letter-spacing="1" fill="#94a3b8">NOT_APPLICABLE</text><text class="lbl" style="--d:0.50s" x="822" y="190" font-size="54" font-weight="800" fill="#e6edf7">10</text><text class="lbl" style="--d:0.50s" x="1138" y="190" font-size="28" font-weight="800" text-anchor="end" fill="#94a3b8">1.9%</text><text x="822" y="212" font-size="12" fill="#93a1bd">the request is not a deletion</text><rect class="seg" style="--d:0.50s" x="1138.4" y="248" width="18.6" height="18" rx="5" fill="#94a3b8" fill-opacity=".9"/><text x="40" y="300" font-size="11.5" fill="#93a1bd">proportions of the 518 cases in output.csv · source: results/run_summary.json</text>
</svg>
