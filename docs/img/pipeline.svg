="232" width="160" height="16" rx="8" fill="#0a0f1f" stroke="#60a5fa" stroke-opacity=".35"/><line class="belt" x1="490" y1="240" x2="630" y2="240" stroke="#60a5fa" stroke-opacity=".45" stroke-width="2"/><text x="486" y="270" font-size="12" fill="#93a1bd">resolve who is who</text><text x="486" y="286" font-size="12" fill="#93a1bd">state at audit_at</text><text x="486" y="302" font-size="12" fill="#93a1bd">recreation graph</text><text class="m" x="486" y="324" font-size="11" fill="#60a5fa">history beats claims</text><g transform="translate(618 302) scale(.75)" fill="none" stroke="#60a5fa" stroke-width="2.4"><circle cx="13" cy="13" r="12"/><line x1="13" y1="13" x2="13" y2="5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 13 13" to="360 13 13" dur="6s" repeatCount="indefinite"/></line></g></g><g><rect x="690" y="160" width="180" height="172" rx="16" fill="#0f1630" stroke="#fbbf24" stroke-opacity=".7" stroke-width="1.5"/><rect x="704" y="160" width="152" height="4" rx="2" fill="#fbbf24"/><circle cx="714" cy="190" r="12" fill="#fbbf24"/><text x="714" y="195" font-size="14" font-weight="800" text-anchor="middle" fill="#0b1020">4</text><text x="734" y="196" font-size="17" font-weight="700" fill="#e6edf7">Plan &amp; judge</text><rect x="700" y="232" width="160" height="16" rx="8" fill="#0a0f1f" stroke="#fbbf24" stroke-opacity=".35"/><line class="belt" x1="710" y1="240" x2="850" y2="240" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2"/><text x="706" y="270" font-size="12" fill="#93a1bd">apply deletion_rules</text><text x="706" y="286" font-size="12" fill="#93a1bd">ordered remediation</text><text x="706" y="302" font-size="12" fill="#93a1bd">no model calls</text><text class="m" x="706" y="324" font-size="11" fill="#fbbf24">rules decide</text><g transform="translate(838 302) scale(.75)" fill="none" stroke="#fbbf24" stroke-width="2.4"><path class="shield" d="M13 0l12 5v9c0 7-5 11-12 14C6 25 1 21 1 14V5z"/><path d="M7 14l4 4 8-8" 