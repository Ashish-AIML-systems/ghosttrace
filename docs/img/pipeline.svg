teMotion><animate attributeName="fill" dur="10.0s" begin="-9.23s" repeatCount="indefinite" values="#e2e8f0;#e2e8f0;#fb7185;#fb7185" keyTimes="0;0.737;0.792;1"/></circle><g><rect x="950" y="92" width="174" height="56" rx="12" fill="#0f1630" stroke="#4ade80" stroke-opacity=".8"/><text x="964" y="115" font-size="13.5" font-weight="700" fill="#4ade80">COMPLETE</text><text x="1112" y="116" font-size="18" font-weight="800" text-anchor="end" fill="#e6edf7">153</text><text x="964" y="135" font-size="11" fill="#93a1bd">every copy compliant</text></g><g><rect x="950" y="212" width="174" height="56" rx="12" fill="#0f1630" stroke="#fb7185" stroke-opacity=".8"/><text x="964" y="235" font-size="13.5" font-weight="700" fill="#fb7185">INCOMPLETE</text><text x="1112" y="236" font-size="18" font-weight="800" text-anchor="end" fill="#e6edf7">355</text><text x="964" y="255" font-size="11" fill="#93a1bd">findings · fixes · checks</text></g><g><rect x="950" y="332" width="174" height="56" rx="12" fill="#0f1630" stroke="#94a3b8" stroke-opacity=".8"/><text x="964" y="355" font-size="13.5" font-weight="700" fill="#94a3b8">NOT_APPLICABLE</text><text x="1112" y="356" font-size="18" font-weight="800" text-anchor="end" fill="#e6edf7">10</text><text x="964" y="375" font-size="11" fill="#93a1bd">not a deletion request</text></g><g><rect x="1160" y="160" width="120" height="172" rx="16" fill="#0f1630" stroke="#4ade80" stroke-opacity=".7" stroke-width="1.5"/><text x="1174" y="198" font-size="16" font-weight="800" fill="#e6edf7">output.csv</text><text x="1174" y="236" font-size="12" fill="#93a1bd">518 rows</text><text x="1174" y="256" font-size="12" fill="#93a1bd">sorted by case</text><text x="1174" y="276" font-size="12" fill="#93a1bd">valid JSON</text><text class="m" x="1174" y="316" font-size="11" fill="#4ade80">sha 55fabff2</text></g><rect class="dash" x="30" y="424" width="1240" height="60" rx="12" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6 6"/><text x="52" y="449" font-size="14" font-weight="700" fill="#fbbf24">GUARDED MODEL ADAPTER · proposes, never decides</text><text x="52" y="470" font-size="12.5" fill="#93a1bd">Only for an unreadable screenshot or an ambiguous request: schema-checked, cached, budget-capped, no tools. A normal run makes 0 model calls.</text><path class="flow" d="M340 424V334" stroke="#fbbf24" stroke-width="2" fill="none"/><path class="flow" d="M560 424V334" stroke="#fbbf24" stroke-width="2" fill="none"/><rect x="30" y="496" width="1240" height="56" rx="12" fill="none" stroke="#2dd4bf" stroke-opacity=".8" stroke-width="1.5"/><text x="52" y="520" font-size="14" font-weight="700" fill="#2dd4bf">VALIDATE &amp; MEASURE</text><text x="52" y="540" font-size="12.5" fill="#93a1bd">An independent validator re-reads output.csv (518 rows, sorted, allowed operation/state pairs). The scorer checks the 32 public answers: false COMPLETE = 0.</text>
