<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 580" width="1300" height="580" role="img" aria-labelledby="t d">
<title id="t">GhostTrace pipeline</title><desc id="d">Deletion requests flow through ingest, reconstruct and plan, then split into COMPLETE, INCOMPLETE and NOT_APPLICABLE verdicts that merge into output.csv.</desc>
<defs><linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b33"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="lane-I" d="M20 240H1215"/><path id="lane-C" d="M20 240H885C915 240 915 120 950 120H1124C1142 120 1142 240 1160 240H1215"/><path id="lane-N" d="M20 240H885C915 240 915 360 950 360H1124C1142 360 1142 240 1160 240H1215"/></defs>
<style>text{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.slide{animation:slide 1.8s ease-in-out infinite alternate}@keyframes slide{to{transform:translateX(6px)}}.shield{transform-box:fill-box;transform-origin:center;animation:beat 2.4s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.12)}}.dash{animation:dash 1.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-12}}.flow{stroke-dasharray:4 8;animation:flow 1s linear infinite}@keyframes flow{to{stroke-dashoffset:12}}.belt{stroke-dasharray:2 8;animation:belt 1s linear infinite}@keyframes belt{to{stroke-dashoffset:-10}}</style>
