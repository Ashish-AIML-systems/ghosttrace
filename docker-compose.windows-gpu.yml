# WINDOWS + NVIDIA GPU ONLY. Layer this on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.windows-gpu.yml run --rm agent
#
# Only the `agent` (the part that runs the local LLM) needs the GPU. `db` and
# `api` are untouched and behave exactly as on every other machine.
#
# Requires: Docker Desktop with the WSL 2 backend, and a current NVIDIA Windows
# driver (the driver itself provides GPU access inside WSL 2 - do not install
# a separate Linux driver). Not for Mac: Docker on macOS cannot reach the Apple GPU.
#
# Check the GPU is visible before the first run:
#   docker run --rm --gpus all nvidia/cuda:12.8.1-base-ubuntu22.04 nvidia-smi
#
# CUDA 12.8 needs NVIDIA driver >= 570. For an older driver, change the two
# image tags below to 12.4.1 (re-resolve their digests) and drop 120 from
# CUDA_ARCHS (120 = RTX 50-series).

services:
  agent:
    image: audit-agent:cuda
    build:
      args:
        # nvidia/cuda:12.8.1-devel-ubuntu22.04  and  ...-runtime-ubuntu22.04, pinned by digest
        BUILD_BASE: nvidia/cuda:12.8.1-devel-ubuntu22.04@sha256:a99a1860ba8e2916e5c3e73b72ec4c4301653a84586e05bfc9a2aa2d58027e97
        RUNTIME_BASE: nvidia/cuda:12.8.1-runtime-ubuntu22.04@sha256:4a801ef9232d2b05e69df4eb8aa054dbbe2824e5499e1e6e857320bb01ac41a9
        GGML_CUDA: "ON"
        # 75 = RTX 20xx/T4, 86 = RTX 30xx, 89 = RTX 40xx, 120 = RTX 50xx
        CUDA_ARCHS: "75;86;89;120"
    environment:
      N_GPU_LAYERS: "99"        # offload all layers; lower it if you run out of VRAM
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
